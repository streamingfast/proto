version: v1
name: buf.build/streamingfast/firehose

deps: []

build:
  excludes:
  - google
  - sf/blockmeta
  - sf/bstream
  - sf/firehose/v1
  - sf/fluxdb
  - sf/graphql
  - sf/headinfo
  - sf/merger
  - sf/search

lint:
  use:
    - DEFAULT
  ignore_only:
    PACKAGE_VERSION_SUFFIX:
      - firehose/options.proto

breaking:
  use:
    - FILE
